<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilwar AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;height:100vh}
.header{background:#111827;color:white;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.sub{font-size:13px;font-weight:normal;margin-top:5px;opacity:.8}
.chat{height:calc(100vh - 140px);overflow-y:auto;padding:15px;max-width:800px;margin:auto}
.message{padding:12px 15px;margin:10px 0;border-radius:15px;max-width:85%;line-height:1.5}
.bot{background:white;border:1px solid #ddd;margin-right:auto}
.user{background:#111827;color:white;margin-left:auto}
.input-area{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;border-top:1px solid #ddd;display:flex;gap:8px;max-width:800px;margin:auto}
input{flex:1;padding:14px;border:1px solid #ccc;border-radius:25px;font-size:16px}
button{border:0;border-radius:25px;padding:0 20px;background:#111827;color:white;font-size:16px}
</style>
</head>
<body>

<div class="header">
🤖 Dilwar AI
<div class="sub">Your Personal AI Assistant</div>
</div>

<div class="chat" id="chat">
<div class="message bot">
नमस्ते! 👋 मैं Dilwar AI हूँ।<br>
आप मुझसे कुछ भी पूछ सकते हैं।
</div>
</div>

<div class="input-area">
<input id="message" placeholder="अपना सवाल लिखें..."
onkeydown="if(event.key==='Enter') sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage(){
const input=document.getElementById("message");
const text=input.value.trim();
if(!text)return;

const chat=document.getElementById("chat");

const user=document.createElement("div");
user.className="message user";
user.innerText=text;
chat.appendChild(user);

input.value="";

setTimeout(()=>{
const bot=document.createElement("div");
bot.className="message bot";
bot.innerText="मैं Dilwar AI हूँ। अभी मेरा AI engine connect नहीं हुआ है। जल्द ही मुझे असली AI से जोड़ा जाएगा। 🤖";
chat.appendChild(bot);
chat.scrollTop=chat.scrollHeight;
},500);

chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
