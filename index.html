<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilwar AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  height:100vh;
}
.header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.sub{
  font-size:13px;
  font-weight:normal;
  margin-top:5px;
  opacity:.8;
}
.chat{
  height:calc(100vh - 140px);
  overflow-y:auto;
  padding:15px;
  max-width:800px;
  margin:auto;
}
.message{
  padding:12px 15px;
  margin:10px 0;
  border-radius:15px;
  max-width:85%;
  line-height:1.5;
  white-space:pre-wrap;
}
.bot{
  background:white;
  border:1px solid #ddd;
  margin-right:auto;
}
.user{
  background:#111827;
  color:white;
  margin-left:auto;
}
.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  border-top:1px solid #ddd;
  display:flex;
  gap:8px;
  max-width:800px;
  margin:auto;
}
input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:25px;
  font-size:16px;
  outline:none;
}
button{
  border:0;
  border-radius:25px;
  padding:0 20px;
  background:#111827;
  color:white;
  font-size:16px;
}
button:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<div class="header">
  🤖 Dilwar AI
  <div class="sub">Your Personal AI Assistant</div>
</div>

<div class="chat" id="chat">
  <div class="message bot">
    नमस्ते! 👋 मैं Dilwar AI हूँ। आप मुझसे कुछ भी पूछ सकते हैं।
  </div>
</div>

<div class="input-area">
  <input
    id="message"
    placeholder="अपना सवाल लिखें..."
    onkeydown="if(event.key==='Enter') sendMessage()"
  >
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>

// ⚠️ यहाँ अपना Apps Script Web App URL डालें
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzhiXkZG-gmbWLgTskjnRT2oxMUgmIe9T__9DnAiae9gub8p-oZaOhUB1xlOAybM7U/exec";

function addMessage(text, type){
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){

  const input = document.getElementById("message");
  const button = document.getElementById("sendBtn");

  const text = input.value.trim();

  if(!text) return;

  addMessage(text, "user");

  input.value = "";
  button.disabled = true;
  button.innerText = "⏳";

  const callbackName =
    "dilwarCallback_" + Date.now();

  window[callbackName] = function(data){

    if(data && data.text){
      addMessage(data.text, "bot");
    }
    else if(data && data.error){
      addMessage("❌ Error: " + data.error, "bot");
    }
    else{
      addMessage("❌ कोई जवाब नहीं मिला।", "bot");
    }

    button.disabled = false;
    button.innerText = "Send";

    delete window[callbackName];
    script.remove();
  };

  const script = document.createElement("script");

  script.src =
    BACKEND_URL +
    "?message=" +
    encodeURIComponent(text) +
    "&callback=" +
    callbackName;

  script.onerror = function(){

    addMessage(
      "❌ Backend से connection नहीं हो पाया।",
      "bot"
    );

    button.disabled = false;
    button.innerText = "Send";

    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}
</script>

</body>
</html>
